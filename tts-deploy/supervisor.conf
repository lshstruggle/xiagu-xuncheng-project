[program:xiagu-tts]
directory=/workspace/xiagu-xuncheng-project
command=/bin/sh -lc '. /workspace/.data/xiagu-tts.env && exec /workspace/venv/bin/gunicorn --workers 1 --threads 4 --bind 127.0.0.1:9881 --timeout 75 --access-logfile - --error-logfile - tts_server:app'
environment=PYTHONUNBUFFERED="1",TOKENIZERS_PARALLELISM="false"
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/.data/logs/xiagu-tts.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/workspace/.data/logs/xiagu-tts-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
