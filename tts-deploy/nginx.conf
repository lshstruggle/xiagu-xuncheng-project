server {
    listen 80;
    server_name _;
    client_max_body_size 16k;

    location = /health { proxy_pass http://127.0.0.1:9881; }
    location = /ready  { proxy_pass http://127.0.0.1:9881; }
    location = /tts {
        proxy_pass http://127.0.0.1:9881;
        proxy_connect_timeout 3s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location / { return 404; }
}
